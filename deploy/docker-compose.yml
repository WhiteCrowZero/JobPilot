name: jobpilot

services:
  postgres:
    image: postgres:16.13-alpine3.23
    container_name: jobpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_EXPORT_PORT:-5432}:5432"
    volumes:
      - jobpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobpilot} -d $${POSTGRES_DB:-jobpilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  postgres_test:
    image: postgres:16.13-alpine3.23
    container_name: jobpilot-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-jobpilot_test}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_TEST_EXPORT_PORT:-5433}:5432"
    volumes:
      - jobpilot_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobpilot} -d $${POSTGRES_TEST_DB:-jobpilot_test}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  redis:
    image: redis:7.4.8-alpine3.21
    container_name: jobpilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-jobpilot_redis}
    ports:
      - "${REDIS_EXPORT_PORT:-6379}:6379"
    volumes:
      - jobpilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jobpilot_redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: jobpilot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-jobpilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-jobpilot_rabbitmq}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${RABBITMQ_EXPORT_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_EXPORT_PORT:-15672}:15672"
    volumes:
      - jobpilot_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobpilot-net

volumes:
  jobpilot_postgres_data:
  jobpilot_postgres_test_data:
  jobpilot_redis_data:
  jobpilot_rabbitmq_data:

networks:
  jobpilot-net:
    driver: bridge
