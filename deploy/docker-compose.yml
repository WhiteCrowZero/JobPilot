services:
  postgres:
    image: postgres:16.13-alpine3.23
    container_name: jobpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_EXPORT_PORT:-5432}:5432"
    volumes:
      - jobpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobpilot} -d $${POSTGRES_DB:-jobpilot}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  redis:
    image: redis:7.4.8-alpine3.21
    container_name: jobpilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-jobpilot_redis}
    ports:
      - "${REDIS_EXPORT_PORT:-6379}:6379"
    volumes:
      - jobpilot_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jobpilot_redis}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  adminer:
    image: adminer:5.4.1
    container_name: jobpilot-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_EXPORT_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobpilot-net

  flower:
    image: mher/flower:2.0.1
    container_name: jobpilot-flower
    restart: unless-stopped
    command:
      - celery
      - --broker=redis://:${REDIS_PASSWORD:-jobpilot_redis}@redis:6379/1
      - flower
      - --port=5555
    ports:
      - "${FLOWER_EXPORT_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jobpilot-net

volumes:
  jobpilot_postgres_data:
  jobpilot_redis_data:

networks:
  jobpilot-net:
    driver: bridge
