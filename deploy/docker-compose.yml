name: jobpilot

services:
  postgres:
    image: postgres:16.13-alpine3.23
    container_name: jobpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_EXPORT_PORT:-5432}:5432"
    volumes:
      - jobpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobpilot} -d $${POSTGRES_DB:-jobpilot}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  postgres_test:
    image: postgres:16.13-alpine3.23
    container_name: jobpilot-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-jobpilot_test}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_TEST_EXPORT_PORT:-5433}:5432"
    volumes:
      - jobpilot_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobpilot} -d $${POSTGRES_TEST_DB:-jobpilot_test}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  redis:
    image: redis:7.4.8-alpine3.21
    container_name: jobpilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-jobpilot_redis}
    ports:
      - "${REDIS_EXPORT_PORT:-6379}:6379"
    volumes:
      - jobpilot_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jobpilot_redis}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jobpilot-net

  pgadmin:
    image: dpage/pgadmin4:9.12
    container_name: jobpilot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@jobpilot.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-jobpilot_pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_EXPORT_PORT:-80}:80"
    volumes:
      - jobpilot_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
      postgres_test:
        condition: service_healthy
    networks:
      - jobpilot-net

  redis_exporter:
    image: oliver006/redis_exporter:v1.84.0-alpine
    container_name: jobpilot-redis-exporter
    restart: unless-stopped
    command:
      - "--redis.addr=redis://redis:6379"
      - "--redis.password=${REDIS_PASSWORD:-jobpilot_redis}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jobpilot-net

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: jobpilot-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_EXPORT_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jobpilot_prometheus_data:/prometheus
    depends_on:
      - redis_exporter
    networks:
      - jobpilot-net

  grafana:
    image: grafana/grafana:13.0.2
    container_name: jobpilot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-jobpilot_grafana}
    ports:
      - "${GRAFANA_EXPORT_PORT:-3000}:3000"
    volumes:
      - jobpilot_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - jobpilot-net

volumes:
  jobpilot_postgres_data:
  jobpilot_postgres_test_data:
  jobpilot_redis_data:
  jobpilot_pgadmin_data:
  jobpilot_prometheus_data:
  jobpilot_grafana_data:

networks:
  jobpilot-net:
    driver: bridge
