# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv pip-audit

      - name: Sync deps
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest --cov --cov-branch --cov-report=term-missing

      - name: Check docker compose config
        run: docker compose -f deploy/docker-compose.yml config
