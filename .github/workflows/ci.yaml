# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SECRET_KEY: "ci-test-secret-key-at-least-20-chars"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv pip-audit

      - name: Sync deps
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Check docker compose config
        run: docker compose -f deploy/docker-compose.yml config

      - name: Start test services
        run: docker compose -f deploy/docker-compose.yml up -d --wait postgres_test redis

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest --cov --cov-branch --cov-report=term-missing