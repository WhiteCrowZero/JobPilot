# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SECRET_KEY: "test-secret-key-for-jobpilot-32-bytes"
      DATABASE_URL: "postgresql+asyncpg://jobpilot:jobpilot@127.0.0.1:5433/jobpilot_test"
      TEST_DATABASE_URL: "postgresql+asyncpg://jobpilot:jobpilot@127.0.0.1:5433/jobpilot_test"
      REDIS_URL: "redis://:jobpilot_redis@127.0.0.1:6379/0"
      CELERY_BROKER_URL: "amqp://jobpilot:jobpilot_rabbitmq@127.0.0.1:5672//"
      CELERY_RESULT_BACKEND: "redis://:jobpilot_redis@127.0.0.1:6379/1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv pip-audit

      - name: Sync deps
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Check docker compose config
        run: docker compose -f deploy/docker-compose.yml config

      - name: Start test services
        run: docker compose -f deploy/docker-compose.yml up -d --wait postgres_test redis rabbitmq

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest --cov --cov-branch --cov-report=term-missing
